name: PhotoManager
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  SQLite:
    url: https://github.com/stephencelis/SQLite.swift.git
    from: 0.15.3
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  PhotoManager:
    type: application
    platform: macOS
    sources:
      - path: PhotoManager
        excludes:
          - Info.plist
    dependencies:
      - package: SQLite
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PhotoManager
        INFOPLIST_FILE: PhotoManager/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: PhotoManager/PhotoManager.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_ASSET_PATHS: "\"PhotoManager/Preview Content\""
        ENABLE_PREVIEWS: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        COMBINE_HIDPI_IMAGES: YES
  PhotoManagerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PhotoManagerTests
    dependencies:
      - target: PhotoManager
      - package: SQLite
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PhotoManager.app/Contents/MacOS/PhotoManager
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PhotoManager:
    build:
      targets:
        PhotoManager: all
        PhotoManagerTests: [test]
    test:
      targets:
        - PhotoManagerTests
